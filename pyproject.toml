[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footboy"
version = "0.1.1"
description = "Synchronize a football video stream with Bilibili live audio and publish it as LAN HLS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "av>=11",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "playwright>=1.40",
  "yt-dlp>=2024.1",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
rapidocr = ["rapidocr-onnxruntime>=1.3; python_version < '3.13'"]
audio = ["scipy>=1.10"]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff>=0.6", "build>=1.2", "wheel"]

[project.scripts]
footboy = "footboy.cli:main"
footboy-p0 = "footboy.tools.p0:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
footboy = ["serve/static/*.html", "serve/static/*.css", "serve/static/*.js", "serve/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
