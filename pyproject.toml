[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "footboy"
version = "0.1.4"
description = "Footboy (足小子): synchronize football video with Bilibili live audio over LAN HLS."
readme = "README.md"
authors = [
  { name = "M1zore1337", email = "251878200+M1zore1337@users.noreply.github.com" },
]
license = "MIT AND Apache-2.0"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "src/footboy/serve/static/vendor/hls.LICENSE",
  "src/footboy/serve/static/vendor/Apache-2.0.txt",
]
requires-python = ">=3.10"
keywords = ["football", "bilibili", "live-streaming", "hls", "ffmpeg", "ocr", "audio-sync"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video :: Display",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
  "av>=11",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "playwright>=1.40",
  "yt-dlp>=2024.1",
]

[project.urls]
Homepage = "https://github.com/M1zore1337/footboy"
Repository = "https://github.com/M1zore1337/footboy"
Issues = "https://github.com/M1zore1337/footboy/issues"
Changelog = "https://github.com/M1zore1337/footboy/blob/main/CHANGELOG.md"


[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
rapidocr = ["rapidocr-onnxruntime>=1.3; python_version < '3.13'"]
audio = ["scipy>=1.10"]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff>=0.6", "build>=1.2", "wheel"]

[project.scripts]
footboy = "footboy.cli:main"
footboy-p0 = "footboy.tools.p0:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
footboy = ["serve/static/*.html", "serve/static/*.css", "serve/static/*.js", "serve/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: real media processing or OCR integration",
  "browser: requires Playwright Chromium and FOOTBOY_BROWSER_TESTS=1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
