name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[dev]"
      - run: footboy --check
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: node --check src/footboy/serve/static/app.js
      - run: python -m pytest -ra -m "not slow"
      - run: python -m build

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -e ".[test,tesseract]"
      - name: Require media and OCR dependencies
        run: |
          footboy --check
          python -c "import av, pytesseract; assert 'eng' in pytesseract.get_languages()"
      - run: python -m pytest -ra -m "slow and not browser"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOOTBOY_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -e ".[test,tesseract]"
      - run: python -m playwright install --with-deps chromium
      - name: Require media and OCR dependencies
        run: |
          footboy --check
          python -c "import av, pytesseract; assert 'eng' in pytesseract.get_languages()"
      - run: python -m pytest -ra -m browser
